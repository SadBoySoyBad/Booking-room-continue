services:
  db:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  db-init:
    image: mongo:8
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "db", "--quiet", "--eval"]
    command: ["try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'db:27017'}]}) }; while (!db.hello().isWritablePrimary) { sleep(1000) }"]
  backend:
    restart: unless-stopped
    build: ./back
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://db:27017/booking?replicaSet=rs0
      MONGODB_DB: booking
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: http://localhost:3000/api/auth/microsoft/callback
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 12s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db-init:
        condition: service_completed_successfully
  frontend:
    restart: unless-stopped
    build: ./front
    environment:
      NUXT_PUBLIC_API_BASE_URL: /api
      NUXT_BACKEND_URL: http://backend:3001
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mongo_data:
